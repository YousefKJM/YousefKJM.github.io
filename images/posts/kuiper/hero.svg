<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Kuiper: a team-scale home for your forensic artifacts">
  <defs>
    <radialGradient id="kg" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1a2233"/><stop offset="100%" stop-color="#0b0f17"/>
    </radialGradient>
    <marker id="ka" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="1200" height="500" fill="url(#kg)"/>
  <g stroke="#1b2430" stroke-width="1" opacity="0.6">
    <path d="M0 125 H1200 M0 250 H1200 M0 375 H1200 M200 0 V500 M400 0 V500 M600 0 V500 M800 0 V500 M1000 0 V500"/>
  </g>
  <!-- pipeline motif: artifacts -> parse -> index -->
  <g>
    <g fill="#0b0f17" stroke="#3a4557" stroke-width="1.5">
      <rect x="70" y="150" width="60" height="44" rx="5"/><rect x="88" y="210" width="60" height="44" rx="5"/><rect x="70" y="270" width="60" height="44" rx="5"/>
    </g>
    <text x="100" y="340" text-anchor="middle" fill="#9aa3b8" font-size="13">artifacts</text>
    <line x1="150" y1="232" x2="210" y2="232" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ka)"/>
    <rect x="214" y="200" width="96" height="66" rx="10" fill="#0b0f17" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="262" y="230" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">parse</text>
    <text x="262" y="250" text-anchor="middle" fill="#9aa3b8" font-size="11">Celery</text>
    <line x1="312" y1="232" x2="372" y2="232" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ka)"/>
    <circle cx="420" cy="233" r="46" fill="#0b0f17" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="420" y="229" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">index</text>
    <text x="420" y="249" text-anchor="middle" fill="#9aa3b8" font-size="11">search</text>
  </g>
  <!-- title -->
  <text x="520" y="150" fill="#e7e9f0" font-size="64" font-weight="800" letter-spacing="-1">Kuiper</text>
  <text x="522" y="205" fill="#5eead4" font-size="24" font-weight="600">A team-scale home for your artifacts</text>
  <text x="522" y="250" fill="#9aa3b8" font-size="19">Collect once, parse on the server, search and tag together.</text>
  <g font-size="15" fill="#c7cdda">
    <rect x="522" y="300" width="130" height="34" rx="17" fill="#1a2233" stroke="#2dd4bf" stroke-width="1"/><text x="587" y="322" text-anchor="middle">Parsers</text>
    <rect x="664" y="300" width="130" height="34" rx="17" fill="#1a2233" stroke="#2dd4bf" stroke-width="1"/><text x="729" y="322" text-anchor="middle">Timeline</text>
    <rect x="806" y="300" width="130" height="34" rx="17" fill="#1a2233" stroke="#2dd4bf" stroke-width="1"/><text x="871" y="322" text-anchor="middle">Rules</text>
  </g>
  <text x="522" y="390" fill="#616a80" font-size="14" font-style="italic">Open-source digital forensics investigation platform</text>
</svg>
