<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CISSP Exam Prep</title>
<meta name="description" content="Interactive CISSP study app: study guide, mind maps, video track, practice exams, flashcards, scenarios and AI tutor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single centered column (max 920px), tool-style views swapped in place; home = exam facts + readiness strip + module grid */
:root{
  --bg:#0d131d; --panel:#141c2a; --panel-2:#1b2536; --line:#26324a;
  --fg:#e7eaf0; --muted:#8e9ab0; --accent:#e2b04a; --accent-ink:#1a1408;
  --good:#3fbf8a; --bad:#ef6b6b; --warn:#e2b04a;
  --d1:#e2b04a; --d2:#5fb3f0; --d3:#a68bf5; --d4:#3fbf8a; --d5:#f08a5f; --d6:#ef6b9a; --d7:#4fd1c5; --d8:#c7d26a;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#eef0f5; --line:#d9dde7;
  --fg:#151b26; --muted:#5b6578; --accent:#a8740f; --accent-ink:#fffaf0;
  --good:#16865a; --bad:#c43c3c; --warn:#a8740f;
  --d1:#a8740f; --d2:#1d6fb8; --d3:#6a4cc9; --d4:#16865a; --d5:#c25a2a; --d6:#c23d72; --d7:#118a80; --d8:#7a8418;
  color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#eef0f5; --line:#d9dde7;
  --fg:#151b26; --muted:#5b6578; --accent:#a8740f; --accent-ink:#fffaf0;
  --good:#16865a; --bad:#c43c3c; --warn:#a8740f;
  --d1:#a8740f; --d2:#1d6fb8; --d3:#6a4cc9; --d4:#16865a; --d5:#c25a2a; --d6:#c23d72; --d7:#118a80; --d8:#7a8418;
  color-scheme:light }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);margin:0}
#app{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.view-head{display:flex;flex-direction:column;gap:6px;margin-block:14px 18px}
.back{background:none;border:0;color:var(--muted);padding:4px 0;font-size:.92rem;align-self:flex-start}
.back:hover{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--dc,var(--accent));background:color-mix(in srgb,var(--dc,var(--accent)) 16%,var(--panel))}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dc,var(--accent));flex:none}
.tag{font-family:var(--f-mono);font-size:.7rem;padding:2px 8px;border-radius:4px;background:color-mix(in srgb,var(--dc,var(--accent)) 18%,transparent);color:var(--dc,var(--accent));letter-spacing:.04em}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding-block:8px 18px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.seal{width:88px;height:88px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;color:var(--accent);line-height:1.3}
.seal b{display:block;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:18px}
.fact{background:var(--panel);padding:12px 14px}
.fact b{display:block;font-family:var(--f-display);font-size:1.35rem}
.fact span{font-size:.8rem;color:var(--muted)}
.ready{margin-block:6px 22px}
.ready-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.bar{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left}
.bar-track{height:64px;background:var(--panel-2);border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar-fill{position:absolute;inset:auto 0 0 0;background:var(--dc);opacity:.85;transition:height .4s}
.bar-pass{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:.7}
.bar small{font-size:.72rem;color:var(--muted);line-height:1.2}
.bar .mono{font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--tc);transform:translateY(-1px)}
.tile .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--tc);font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.tile p{font-size:.9rem;color:var(--muted)}
.tile.wide{grid-column:span 3;flex-direction:row;align-items:center;gap:14px}
.tile.wide div{flex:1;min-width:0}

/* Countdown */
.countdown{margin-bottom:22px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.cd-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.cd-days{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:6px 10px;border-right:1px solid var(--line)}
.cd-days b{font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--accent)}
.cd-days span{font-size:.8rem;color:var(--muted);margin-top:4px}
@media (max-width:520px){ .cd-main{grid-template-columns:1fr} .cd-days{flex-direction:row;gap:8px;align-items:baseline;border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px;justify-content:flex-start} }

/* Study */
.points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.points li{padding:12px 0 12px 22px;border-bottom:1px solid var(--line);position:relative}
.points li:last-child{border-bottom:0}
.points li::before{content:"";position:absolute;left:4px;top:21px;width:7px;height:7px;border-radius:2px;background:var(--dc)}

/* Mind map */
.map-wrap{overflow-x:auto}
.map-wrap svg{display:block;width:100%;max-width:760px;margin:0 auto;height:auto}
.map-node{cursor:pointer}
.map-node:focus{outline:none}
.map-node:focus-visible rect{stroke:var(--fg);stroke-width:2}
.leaves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.leaf{background:var(--panel-2);border-radius:8px;padding:10px 12px;font-size:.95rem;border-left:3px solid var(--bc)}

/* Exam */
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .key{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none;width:1.2em}
.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel-2))}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel-2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel-2))}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--good);background:var(--panel-2);padding:12px 14px;border-radius:0 8px 8px 0}
.explain.bad{border-left-color:var(--bad)}
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer.low{color:var(--bad)}
.q-stem{font-size:1.12rem;font-weight:600;line-height:1.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;padding:8px 14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.score-big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;line-height:1}
.dbars{display:flex;flex-direction:column;gap:8px}
.dbar{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:.9rem}
.dbar-track{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden;position:relative}
.dbar-track i{position:absolute;inset:0 auto 0 0;background:var(--dc)}
.review-item{border-top:1px solid var(--line);padding-top:12px}

/* Flashcards */
.card3d{perspective:1200px}
.flash{position:relative;min-height:230px;width:100%;border:0;padding:0;background:none;text-align:center}
.flash .face{position:absolute;inset:0;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;backface-visibility:hidden;transition:transform .45s}
.flash .back-face{transform:rotateY(180deg);background:var(--panel-2)}
.flash.flipped .front{transform:rotateY(180deg)}
.flash.flipped .back-face{transform:rotateY(360deg)}
.flash .term{font-family:var(--f-display);font-size:1.7rem;font-weight:800}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.boxes div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:.75rem;color:var(--muted)}
.boxes b{display:block;font-family:var(--f-mono);font-size:1rem;color:var(--fg)}

/* Reference */
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--fg);font:inherit}
.ref-item{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px}
.ref-item b{font-family:var(--f-display);font-weight:700}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:2px}

/* Tutor */
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,var(--panel-2))}
.msg.ai{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:vertical;min-height:48px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
.notice{background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:.92rem}

/* Videos */
.upnext{width:100%;margin-bottom:12px}
.upnext .eyebrow{display:block;margin-bottom:2px}
.vlist{display:flex;flex-direction:column}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vcheck{width:26px;height:26px;flex:none;border-radius:6px;border:1.5px solid var(--dc);background:transparent;color:var(--bg);font-weight:800;font-size:.85rem;display:grid;place-items:center;padding:0}
.vrow.watched .vcheck{background:var(--dc)}
.vmain{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.vtitle{color:var(--fg);text-decoration:none;font-weight:600}
.vtitle:hover{text-decoration:underline;text-decoration-color:var(--dc)}
.vrow.watched .vtitle{color:var(--muted)}
.vmeta{font-size:.8rem}
.vbtn{padding:6px 12px;font-size:.85rem;flex:none}
.vdetail{border:1px solid var(--dc);border-radius:var(--r);background:var(--panel);padding:16px;margin-block:4px 10px}
.vdetail ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.vprog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vprog div{background:var(--panel);padding:12px 14px}
.vprog b{display:block;font-family:var(--f-display);font-size:1.35rem}
.vprog span{font-size:.8rem;color:var(--muted)}
.src{font-size:.85rem;color:var(--muted)}
.src a{color:var(--accent)}

/* Motivation */
.motive{text-align:center;padding-block:28px}
.motive h2{font-size:clamp(2rem,6vw,2.8rem)}
.motive ul{list-style:none;padding:0;margin:18px auto 0;max-width:520px;text-align:left;display:flex;flex-direction:column;gap:8px}
.motive li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.motive li::before{content:"✓ ";color:var(--good);font-weight:700}

@media (max-width:720px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile.wide{grid-column:span 2}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bars{grid-template-columns:repeat(4,minmax(0,1fr))}
  .leaves{grid-template-columns:1fr}
  .dbar{grid-template-columns:96px 1fr 48px}
  .ref-item{grid-template-columns:1fr;gap:4px}
  .seal{width:68px;height:68px}
}
@media (max-width:420px){ .grid{grid-template-columns:1fr} .tile.wide{grid-column:span 1} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

</head>
<body>
<div id="app" aria-live="polite"></div>

<script src="data/content.js"></script>
<script src="data/glossary.js"></script>
<script src="data/q1.js"></script>
<script src="data/q2.js"></script>
<script src="data/q3.js"></script>
<script src="data/q4.js"></script>
<script src="data/q5.js"></script>
<script src="data/q6.js"></script>
<script src="data/q7.js"></script>
<script src="data/q8.js"></script>
<script src="data/q9.js"></script>
<script src="data/outline.js"></script>
<script src="data/videos.js"></script>
<script>
(() => {
const D = window.DOMAINS, Q = window.QBANK, G = window.GLOSSARY, V = window.VIDEOS, PL = window.PLAYLIST;
const dc = d => `var(--d${d})`;
const app = document.getElementById("app");

// ── tiny DOM helper (textContent only; never innerHTML for content) ──
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "css") for (const [p,val] of Object.entries(v)) el.style.setProperty(p,val);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const SVG_STYLE = new Set(["fill","stroke","font-family"]);
const svg = (tag, attrs, ...kids) => { const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k,v] of Object.entries(attrs||{})) { if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (SVG_STYLE.has(k)) el.style.setProperty(k, v); else el.setAttribute(k,v); } kids.flat().forEach(c => c!=null && el.append(c.nodeType?c:document.createTextNode(c))); return el; };

// ── stable question ids ──
const hash = s => { let x = 0; for (let i=0;i<s.length;i++) x = (x*31 + s.charCodeAt(i))|0; return (x>>>0).toString(36); };
Q.forEach(q => q.id = q.d + "-" + hash(q.q));

// ── progress (this browser; synced across devices on claude.ai) ──
const KEY = "cissp-prep-v1";
const blankP = () => ({ qs:{}, exams:[], cards:{}, videos:{}, daily:{}, settings:{} });
let P = blankP();
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch {} scheduleSync(); };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function record(q, ok){ const r = P.qs[q.id] || {n:0,c:0}; r.n++; if (ok) r.c++; r.last = ok?1:0; P.qs[q.id] = r;
  const t = today(); P.daily[t] = (P.daily[t]||0) + 1; }

// Merge two progress snapshots without losing work done on either device.
function mergeP(a, b){
  const m = blankP();
  for (const id of new Set([...Object.keys(a.qs||{}), ...Object.keys(b.qs||{})])){ const x = a.qs?.[id], y = b.qs?.[id]; m.qs[id] = !x ? y : !y ? x : (y.n > x.n ? y : x); }
  const ex = new Map(); [...(a.exams||[]), ...(b.exams||[])].forEach(e => ex.set(e.date, e));
  m.exams = [...ex.values()].sort((p,q)=>p.date<q.date?-1:1).slice(-30);
  for (const t of new Set([...Object.keys(a.cards||{}), ...Object.keys(b.cards||{})])){ const x = a.cards?.[t], y = b.cards?.[t]; m.cards[t] = !x ? y : !y ? x : (y.due > x.due ? y : x); }
  m.videos = Object.assign({}, b.videos, a.videos);
  for (const d of new Set([...Object.keys(a.daily||{}), ...Object.keys(b.daily||{})])) m.daily[d] = Math.max(a.daily?.[d]||0, b.daily?.[d]||0);
  m.settings = (b.settings?.updated||0) > (a.settings?.updated||0) ? b.settings : (a.settings||{});
  return m;
}

// ── cross-device sync: a private per-person record, only where claude.ai provides one ──
let syncRef = null, syncStatus = "off", syncTimer = null, syncBusy = false, lastPushed = "";
function scheduleSync(){ if (!syncRef) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushSync, 2500); }
async function pushSync(){
  if (!syncRef || syncBusy) return;
  const body = JSON.stringify(P); if (body === lastPushed) return;
  syncBusy = true;
  try { await syncRef.set({ p: body, at: Date.now() }); lastPushed = body; syncStatus = "on"; }
  catch (e) { syncStatus = "error"; }
  syncBusy = false;
  if (JSON.stringify(P) !== lastPushed) scheduleSync();
}
(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    const uid = db && user ? await user.id() : null;
    if (!uid) return;
    syncRef = db.doc("data/users/" + uid + "/progress");
    const snap = await syncRef.get();
    if (snap.exists){ try { P = mergeP(P, JSON.parse(snap.data().p)); } catch {} }
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch {}
    syncStatus = "on"; await pushSync(); render();
  } catch { syncRef = null; syncStatus = "error"; }
})();

// ── backup file (works everywhere, including the blog embed) ──
async function exportProgress(){
  const data = JSON.stringify({ app:"cissp-prep", v:1, exported:new Date().toISOString(), p:P }, null, 1);
  const filename = `cissp-progress-${today()}.json`;
  try { const dl = await window.claude?.use?.("downloads"); if (dl){ await dl.save({ filename, data }); return; } } catch { return; }

function weightedPick(domains, count){
  const pool = Q.filter(q=>domains.includes(q.d));
  if (count >= pool.length) return shuffle(pool);
  // unseen and previously-missed first within each domain, then by official weight
  const score = q => { const r = P.qs[q.id]; return !r ? 0 : r.last===0 ? 1 : 2; };
  const byD = {}; domains.forEach(d => byD[d] = shuffle(pool.filter(q=>q.d===d)).sort((a,b)=>score(a)-score(b)));
  const wsum = domains.reduce((s,d)=>s+D[d-1].weight,0);
  const out = [];
  domains.forEach(d => { const n = Math.round(count*D[d-1].weight/wsum); out.push(...byD[d].splice(0,n)); });
  const rest = shuffle(domains.flatMap(d=>byD[d]));
  while (out.length < count && rest.length) out.push(rest.pop());
  return shuffle(out.slice(0,count));
}

         end: cfg.mode==="exam" ? Date.now() + qs.length*72000 : null };
  go("exam");
}

    if (EX.pick==null) return;

    EX.ans[EX.i] = { pick: cur.order[EX.pick], ok };

  };
  const next = () => { if (EX.i < n-1){ EX.i++; EX.pick=null; EX.revealed=false; render(); } else finishExam(); };
  const opts = cur.order.map((oi,k) => {

    return h("button",{class:cls,role:"radio","aria-checked":String(EX.pick===k),disabled:EX.revealed,onclick:()=>{ EX.pick=k; render(); }},
      h("span",{class:"key"},"ABCD"[k]), h("span",{},q.o[oi]));
  });
  const a = EX.ans[EX.i];
  return h("div",{},
    h("div",{class:"view-head"},
      h("button",{class:"back",onclick:()=>{ stopTimer(); go("setup",{cfg:EX.cfg.domains?EX.cfg:undefined}); }},"← Quit session"),
      h("div",{class:"exam-top"},
        h("span",{class:"eyebrow"}, `${EX.mode==="exam"?"Exam":"Study"} mode · Question ${EX.i+1} of ${n}`),
        EX.end ? timer : h("span",{class:"mono muted"}, `${EX.ans.filter(x=>x&&x.ok).length} correct`)),
      h("div",{class:"progress"},h("i",{style:{width:((EX.i)/n*100)+"%"}}))),
    h("div",{class:"panel stack"},
      h("div",{class:"row"}, h("span",{class:"tag",css:{"--dc":dc(q.d)}},`D${q.d} · ${D[q.d-1].short}`)),
      h("p",{class:"q-stem"}, q.q),
      h("div",{class:"opt-list",role:"radiogroup"}, opts),
      EX.revealed && h("div",{class:"explain"+(a.ok?"":" bad")}, h("b",{}, a.ok ? "Correct. " : `Not quite. Answer: ${q.o[q.a]}. `), q.e),
      h("div",{class:"row",style:{justifyContent:"space-between"}},
        EX.revealed && tutorOn() ? h("button",{class:"btn ghost",onclick:()=>askTutor(explainPrompt(q, a.pick))},"Ask tutor why") : h("span",{}),
        EX.revealed ? h("button",{class:"btn",onclick:next}, EX.i<n-1?"Next →":"See results")
                    : h("button",{class:"btn",disabled:EX.pick==null,onclick:submit}, EX.mode==="exam" ? (EX.i<n-1?"Submit & next":"Submit & finish") : "Check answer")))

function finishExam(){

  const correct = done.filter(x=>x.a.ok).length;

}

VIEWS.cards = () => {

// ── AI tutor (sample capability) ──
const TUTOR_RULES = `You are a CISSP exam tutor for Yousef, an experienced incident response and DFIR practitioner preparing for the ISC2 CISSP exam (2024 outline, 8 domains). Be direct, structured and practical. Teach the "think like a manager" mindset: governance, risk, and business alignment over hands-on fixes, with life safety always first. When explaining a practice question, say why the correct answer is BEST and why each distractor is weaker. Use short sections or bullets, keep it under 250 words unless asked for more, and use plain text (no markdown tables).`;
let sampleFn, sampleReady = false;
// Hide every tutor entry point where Claude is not reachable (e.g. the blog embed).
const tutorOn = () => sampleReady ? !!sampleFn : !!window.claude;
(async () => { try { sampleFn = await window.claude?.use?.("sample"); } catch {} sampleReady = true; if (!sampleFn || view==="tutor") render(); })();
const chat = { turns: [], busy: false, ctl: null, error: "" };
function explainPrompt(q, pick){
  return `Explain this CISSP practice question.\n\nQuestion (Domain ${q.d}): ${q.q}\nOptions:\n${q.o.map((o,i)=>`${"ABCD"[i]}. ${o}`).join("\n")}\n\nCorrect answer: ${q.o[q.a]}\nI chose: ${q.o[pick]}\n\nWhy is the correct answer BEST, and what was wrong with my thinking?`;
}
function askTutor(text){ if (!tutorOn()) return; go("tutor"); sendChat(text); }
async function sendChat(text){
  text = (text||"").trim(); if (!text || chat.busy) return;
  chat.error = ""; chat.turns.push({role:"user",content:text}); chat.turns.push({role:"assistant",content:"Thinking…",pending:true}); chat.busy = true; render();
  if (!sampleFn){ chat.turns.pop(); chat.busy=false; chat.error="The tutor isn't available in this view."; render(); return; }
  const hist = chat.turns.filter(t=>!t.pending).slice(-12);
  const input = hist.map((t,i) => i===0 ? {role:"user",content:TUTOR_RULES+"\n\n---\n\n"+t.content} : {role:t.role,content:t.content});
  if (input[0].role !== "user") input.shift();
  const bubble = chat.turns[chat.turns.length-1];
  chat.ctl = new AbortController();
  try {
    const { text: out } = await sampleFn(input, { cache:false, signal: chat.ctl.signal, onText: ({text}) => { bubble.content = text; const el = document.getElementById("pending-bubble"); if (el) el.textContent = text; } });
    bubble.content = out; delete bubble.pending;
  } catch (e) {
    const msgs = { not_granted:"The tutor needs your permission to use Claude. Allow it when asked, or reload the page to be asked again.", rate_limited:"Too many requests just now. Wait a minute and try again.", cancelled:"" };
    if (e && e.text) { bubble.content = e.text; delete bubble.pending; } else chat.turns.pop();
    chat.error = msgs[e?.code] ?? "Couldn't reach the tutor. Try again in a moment.";
  }
  chat.busy = false; chat.ctl = null; render();
}
VIEWS.tutor = () => {
  const box = h("textarea",{id:"tutor-input",rows:2,placeholder:"Ask about a concept, e.g. “When do I pick Biba over Clark-Wilson?”","aria-label":"Message the tutor",
    onkeydown:e=>{ if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); const v=box.value; box.value=""; sendChat(v); } }});
  const quick = ["Explain ALE with a worked example","Compare SAML, OAuth and OIDC","Give me 3 hard Domain 7 questions","How should I think about 'FIRST' questions?"];
  const log = h("div",{class:"chat",id:"chat-log"},
    chat.turns.length ? chat.turns.map(t => h("div",{class:"msg "+(t.role==="user"?"user":"ai"), id:t.pending?"pending-bubble":null}, t.content))
      : h("div",{class:"muted",style:{alignSelf:"center",textAlign:"center",padding:"30px 10px"}},"Ask anything about the 8 domains. From a practice question, use “Ask tutor why” to get a full breakdown."));
  queueMicrotask(()=>{ log.scrollTop = log.scrollHeight; });
  const unavailable = sampleReady && !sampleFn;
  return h("div",{},
    head("AI Tutor","Ask Claude","Answers use your own Claude account. You'll be asked to allow it the first time."),
    unavailable ? h("div",{class:"notice"},"The AI tutor only works when this page is opened on claude.ai. Everything else in the app works without it.") : null,
    h("div",{class:"panel stack"},
      log,
      chat.error ? h("p",{style:{color:"var(--bad)",fontSize:".9rem"}},chat.error) : null,
      !chat.turns.length ? h("div",{class:"row"}, quick.map(q => h("button",{class:"chip",disabled:unavailable,onclick:()=>sendChat(q)},q))) : null,
      h("div",{class:"composer"}, box,
        chat.busy ? h("button",{class:"btn ghost",onclick:()=>chat.ctl?.abort()},"Stop")
                  : h("button",{class:"btn",disabled:unavailable,onclick:()=>{ const v=box.value; box.value=""; sendChat(v); }},"Send")),
      chat.turns.length ? h("button",{class:"back",onclick:()=>{ chat.turns=[]; chat.error=""; render(); }},"Clear conversation") : null)
  );
};

VIEWS.motive = () => h("div",{},
  back(),
  h("div",{class:"motive"},
    h("span",{class:"eyebrow"},"Night before the exam"),
    h("h2",{style:{marginTop:"8px"}},"You've got this, Yousef."),
    h("p",{class:"muted",style:{maxWidth:"52ch",margin:"12px auto 0"}},"You've handled real incidents under pressure. This exam asks the same judgment from the manager's chair: protect people, understand the business, manage risk, and follow process."),
    h("ul",{}, ["You score 75%+ consistently on mixed 100-question sets","No domain sits under 65%","You can explain BLP vs Biba vs Clark-Wilson without notes","You default to 'what would the CISO advise?' before 'how would I fix it?'","You've done a full timed 150-question run and kept pace"].map(x=>h("li",{},x))),
    h("div",{class:"panel",style:{maxWidth:"520px",margin:"18px auto 0",textAlign:"left"}},
      h("h3",{},"Exam day"),
      h("p",{class:"muted",style:{marginTop:"6px"}},"Sleep. Eat. Arrive early with ID. Read every qualifier. Life safety first. No going back on CAT, so commit and move on. If it ends at 100, that's normal."))));

render();
})();
</script>
