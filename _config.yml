# Site
title: "YMTech"
tagline: "Field notes on DFIR, cloud & software engineering"
description: "Yousef Majeed's personal blog — notes on digital forensics & incident response, SOC operations, cloud engineering, and software development."
url: "https://blog.yousefkjm.info"
baseurl: ""
lang: "en"

# Author
author:
  name: "Yousef Majeed"
  role: "DFIR Specialist @ SABIC"
  avatar: "/images/main/author.jpg"
  email: "yousefkjm@outlook.com"
  website: "https://yousefkjm.info"
  github: "https://github.com/YousefKJM"
  linkedin: "https://www.linkedin.com/in/yousefkhm/"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false

highlighter: rouge
permalink: /:title/
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

sass:
  style: compressed
  sass_dir: _sass

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
